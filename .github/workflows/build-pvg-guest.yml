name: Build Pome Virtual GPU guest (macOS 26)

# Builds everything that runs inside the Tahoe guest: PVGTransport.kext (Hyper-V socket transport),
# PVGAccel.kext (IOAccelerator, NullMoth-derived), the PVGMTLDriver Metal plugin (NullMoth-derived),
# the AIR->SPIR-V translator, Mesa Venus with pome's Hyper-V renderer, and the Khronos Vulkan loader.
# Each component is its own job so one failure does not hide the others. Every input is pinned.
on:
  workflow_dispatch:
  push:
    paths: ['gpu/**', '.github/workflows/build-pvg-guest.yml']

permissions:
  contents: read

env:
  MHV_COMMIT: cafcd34daea5e58633112a1e63cef1f07bbc8404     # MacHyperVSupport 1.0.0 (headers for PVGTransport)
  SDK_COMMIT: 3f750085caa17ec3a7880f11c11bf4f48cd6a164     # MacKernelSDK
  OCBUILD_COMMIT: 020b14fa68a9825642e0c0fb643c2963bd679ae3
  LILU_COMMIT: 0249c3a918c68a43891350f35fded615b1575776
  MESA_COMMIT: 0c106844d95bafd1ab2ac4271333f7ffa09df4fd    # Mesa main 2026-11-05
  LOADER_TAG: v1.4.367
  HEADERS_TAG: v1.4.367
  OGKM_COMMIT: 4bfe30bb78e7364959e59c16cfefd88e8c14670e    # open-gpu-kernel-modules 615.78.08 (nvkms-kapi.h only)

jobs:
  kexts:
    runs-on: macos-15-intel
    env: { PROJECT_TYPE: KEXT, JOB_TYPE: BUILD, ACID32: 1 }
    steps:
      - uses: actions/checkout@v4
        with: { path: pome }
      - uses: actions/checkout@v4
        with: { repository: acidanthera/MacHyperVSupport, ref: '${{ env.MHV_COMMIT }}', path: mhv }
      - uses: actions/checkout@v4
        with: { repository: acidanthera/MacKernelSDK, ref: '${{ env.SDK_COMMIT }}', path: mhv/MacKernelSDK }
      - name: Lilu headers
        working-directory: mhv
        run: |
          src=$(/usr/bin/curl -Lfs "https://raw.githubusercontent.com/acidanthera/ocbuild/${OCBUILD_COMMIT}/ci-bootstrap.sh") || exit 1
          src=$(printf '%s\n' "$src" | sed -e 's/XCODE_VERSION="[^"]*"/XCODE_VERSION="16.4.0"/' -e 's#${DEVELOPER_DIR}/usr/bin/python3#/usr/bin/python3#g') || exit 1
          eval "$src" || exit 1
          src=$(/usr/bin/curl -Lfs "https://raw.githubusercontent.com/acidanthera/Lilu/${LILU_COMMIT}/Lilu/Scripts/bootstrap.sh") && eval "$src" || exit 1
          find . -name kern_api.hpp | head -1
      - name: NVKMS kernel API header
        run: |
          git init -q ogkm && cd ogkm && git remote add origin https://github.com/NVIDIA/open-gpu-kernel-modules.git
          git sparse-checkout set src/nvidia-modeset/kapi/interface src/common/sdk/nvidia/inc src/common/inc src/nvidia-modeset/interface src/common/unix/common/inc src/common/modeset src/nvidia/arch/nvalloc/unix/include
          git fetch -q --depth 1 origin "$OGKM_COMMIT" && git checkout -q FETCH_HEAD
      - name: Build PVGTransport.kext
        run: |
          set -euo pipefail
          SDK=$PWD/mhv/MacKernelSDK; M=$PWD/mhv/MacHyperVSupport; K=pome/gpu/guest/kext/PVGTransport
          LILU=$(dirname "$(dirname "$(find mhv -path '*Headers/kern_api.hpp' | head -1)")")
          OUT=out/PVGTransport.kext/Contents; mkdir -p $OUT/MacOS
          FLAGS="-arch x86_64 -fapple-kext -mkernel -nostdinc -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common -O2 -Wall -Wno-unused-parameter
                 -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT -I$SDK/Headers -I$LILU -I$M -I$M/VMBus -I$M/VMBusDevice -I$M/Controller
                 -I$M/InterruptController -Ipome/gpu/protocol -I$K -mmacosx-version-min=10.13"
          for f in PVGTransport PVGUserClient; do xcrun clang++ $FLAGS -c $K/$f.cpp -o out/$f.o; done
          xcrun clang++ -arch x86_64 -fapple-kext -nostdlib -Xlinker -kext -L$SDK/Library/x86_64 -lkmodc++ -lkmod -lcc_kext \
            out/PVGTransport.o out/PVGUserClient.o -o $OUT/MacOS/PVGTransport
          cp $K/Info.plist $OUT/Info.plist
      - name: Build PVGAccel.kext
        run: |
          set -euo pipefail
          SDK=$(xcrun --show-sdk-path); KHDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"; A=pome/gpu/guest/metal/accel; O=ogkm/src
          OUT=out/PVGAccel.kext/Contents; mkdir -p $OUT/MacOS
          xcrun clang++ -arch x86_64 -fapple-kext -mkernel -nostdinc -I"$KHDR" -Ipome/gpu/guest/metal -I$A -I$A/iofam -I$A/re \
            -I$O/nvidia-modeset/kapi/interface -I$O/nvidia-modeset/interface -I$O/common/sdk/nvidia/inc -I$O/common/inc -I$O/common/unix/common/inc -I$O/common/modeset -I$O/nvidia/arch/nvalloc/unix/include \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT -DNMX_ACCEL -DPVG_ACCEL -DNM_TAHOE \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -Wno-unused-function -O2 \
            -c $A/nvrm-accel.cpp -o out/pvg-accel.o
          xcrun clang++ -arch x86_64 -fapple-kext -nostdlib -Xlinker -kext -lkmodc++ -lkmod -lcc_kext out/pvg-accel.o -o $OUT/MacOS/PVGAccel
          cp $A/Info.plist $OUT/Info.plist
      - name: Check kexts are loadable
        run: |
          set -euo pipefail
          # OpenCore and kmutil need kmod_info (the kext's name and version); without it OpenCore
          # reports "Prelinked injection ... Invalid Parameter" and the kext never loads.
          for k in PVGTransport PVGAccel; do
            bin=out/$k.kext/Contents/MacOS/$k
            nm "$bin" | grep -q ' _kmod_info$' || { echo "::error::$k has no _kmod_info"; exit 1; }
            otool -l "$bin" | grep -q LC_DYLD_CHAINED_FIXUPS && { echo "::error::$k uses chained fixups, which OpenCore cannot inject"; exit 1; }
            echo "$k: kmod_info present, classic fixups"
          done
      - uses: actions/upload-artifact@v4
        with: { name: pvg-kexts, path: 'out/*.kext', retention-days: 30 }

  mesa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { path: pome }
      - name: Tools
        run: brew install meson ninja && python3 -m pip install --break-system-packages mako pyyaml packaging
      - name: Mesa with pome's Hyper-V renderer
        run: |
          set -euo pipefail
          git init -q mesa && cd mesa && git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch -q --depth 1 origin "$MESA_COMMIT" && git checkout -q FETCH_HEAD
          python3 ../pome/gpu/guest/mesa/apply_pvg.py .
          meson setup build -Dbuildtype=release -Dvulkan-drivers=virtio -Dgallium-drivers= -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dopengl=false -Dllvm=disabled \
            -Dvalgrind=disabled -Dlibunwind=disabled -Dzstd=disabled -Dexpat=disabled -Dvulkan-layers=
          ninja -C build src/virtio/vulkan/libvulkan_virtio.dylib src/virtio/vulkan/virtio_icd.x86_64.json
          mkdir -p ../out && cp build/src/virtio/vulkan/libvulkan_virtio.dylib ../out/
          python3 ../pome/gpu/guest/package/fix_icd.py build/src/virtio/vulkan/virtio_icd.x86_64.json ../out/virtio_icd.json
      - name: Check the Venus driver loads
        run: |
          # Linked with -undefined dynamic_lookup, so a missing non-weak symbol only fails at load time
          # (Tahoe: "symbol not found in flat namespace '_vtn_add_specialization_entry'"). Load it the
          # way the Metal layer does (RTLD_NOW) and ask for the ICD entry point.
          python3 - out/libvulkan_virtio.dylib <<'PY'
          import ctypes, os, sys
          lib = ctypes.CDLL(sys.argv[1], mode=os.RTLD_NOW | os.RTLD_LOCAL)
          lib.vk_icdGetInstanceProcAddr
          print("libvulkan_virtio.dylib loads; vk_icdGetInstanceProcAddr found")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: pvg-mesa, path: out, retention-days: 30 }

  loader:
    runs-on: macos-15-intel
    steps:
      - name: Khronos Vulkan loader
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers.git
          cmake -S Vulkan-Headers -B hb -DCMAKE_INSTALL_PREFIX=$PWD/vh && cmake --install hb
          git clone -q --depth 1 -b "$LOADER_TAG" https://github.com/KhronosGroup/Vulkan-Loader.git
          cmake -S Vulkan-Loader -B lb -DCMAKE_BUILD_TYPE=Release -DVULKAN_HEADERS_INSTALL_DIR=$PWD/vh -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build lb -j 4
          mkdir -p out && cp "$(find lb -name 'libvulkan.1.*.dylib' | head -1)" out/libvulkan.dylib
          install_name_tool -id @rpath/libvulkan.dylib out/libvulkan.dylib
      - uses: actions/upload-artifact@v4
        with: { name: pvg-loader, path: out, retention-days: 30 }

  translator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { path: pome }
      - name: AIR to SPIR-V translator
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin --manifest-path pome/gpu/guest/metal/translator/wrapper/Cargo.toml --target-dir t
          mkdir -p out && cp t/x86_64-apple-darwin/release/libpvgmtl_translate.dylib out/
          install_name_tool -id @rpath/libpvgmtl_translate.dylib out/libpvgmtl_translate.dylib
      - uses: actions/upload-artifact@v4
        with: { name: pvg-translator, path: out, retention-days: 30 }

  plugin:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { path: pome }
      - name: Newest Xcode (macOS 26 SDK when present)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"; xcrun --show-sdk-version
      - name: Vulkan headers
        run: git clone -q --depth 1 -b "$HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers.git
      - name: PVGMTLDriver (one translation unit, as upstream builds it)
        working-directory: pome/gpu/guest/metal/plugin
        run: |
          set -o pipefail
          mkdir -p ../../../../../out
          xcrun clang -arch x86_64 -mmacosx-version-min=26.0 -bundle -fobjc-arc -O1 -DPVGMTL_RELEASE=1 \
            -Wno-protocol -Wno-incomplete-implementation -I../../../../../Vulkan-Headers/include \
            -o ../../../../../out/PVGMTLDriver PVGMTLDevice.m \
            -framework Foundation -framework Metal -framework IOSurface -framework IOKit -framework CoreFoundation -framework MetalFX \
            2> ../../../../../out/build.err || { grep ' error:' ../../../../../out/build.err | head -40; exit 1; }
          grep -c ': warning:' ../../../../../out/build.err || true
      - uses: actions/upload-artifact@v4
        with: { name: pvg-plugin, path: out, retention-days: 30 }

  package:
    needs: [kexts, mesa, loader, translator, plugin]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { path: pome }
      - uses: actions/download-artifact@v4
        with: { path: in }
      - name: Assemble pvg-guest package
        run: |
          set -euo pipefail
          R=pkg/pvg-guest; P=pome/gpu/guest/package
          mkdir -p $R/Library/Extensions $R/Library/GPUBundles/pvgmtl $R/Library/GPUBundles/PVGMTLDriver.bundle/Contents/MacOS
          cp -R in/pvg-kexts/*.kext $R/Library/Extensions/
          cp in/pvg-plugin/PVGMTLDriver $R/Library/GPUBundles/PVGMTLDriver.bundle/Contents/MacOS/
          cp $P/PVGMTLDriver.Info.plist $R/Library/GPUBundles/PVGMTLDriver.bundle/Contents/Info.plist
          cp in/pvg-mesa/libvulkan_virtio.dylib in/pvg-mesa/virtio_icd.json in/pvg-loader/libvulkan.dylib \
             in/pvg-translator/libpvgmtl_translate.dylib $R/Library/GPUBundles/pvgmtl/
          cp $P/pvgmtl-allow.txt $R/Library/GPUBundles/
          cp $P/install.sh $P/uninstall.sh $R/ && chmod +x $R/*.sh
          mkdir -p $R/licenses && cp pome/gpu/guest/metal/LICENSE pome/gpu/guest/metal/NOTICE $R/licenses/
          cp pome/gpu/guest/metal/translator/LICENSE $R/licenses/translator-LGPL-3.0.txt
          find $R/Library -type f -name '*.dylib' -o -type f -path '*MacOS*' | xargs -I{} codesign -f -s - {} 2>/dev/null || true
          (cd $R && find Library -type f | sort | xargs shasum -a 256 > SHA256SUMS)
          tar -C pkg -czf pvg-guest-0.1.0.tar.gz pvg-guest
          shasum -a 256 pvg-guest-0.1.0.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: pvg-guest, path: pvg-guest-0.1.0.tar.gz, retention-days: 90 }
